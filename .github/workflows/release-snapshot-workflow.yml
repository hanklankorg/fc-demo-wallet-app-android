# Builds the signed demo release of a branch and uploads its AAB to the
# Google Play internal track: no version bump, no changelog, no GitHub
# release. Triggered manually, on the branch to build.
name: Release Snapshot Workflow
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # Build Android app with signing
  build:
    uses: hanklankorg/fc-forge-ci/.github/workflows/build-gradle-android.yml@d33ea2bd2260bad172b2af3a79d2a2f066dfc293 # v0.90.0
    permissions:
      contents: read
    secrets:
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      SECRETS_PROPERTIES_BASE64: ${{ secrets.SECRETS_PROPERTIES_BASE64 }}
    with:
      forge-ci-binary-ref: d33ea2bd2260bad172b2af3a79d2a2f066dfc293
      runtime-image: ghcr.io/hanklankorg/fc-forge-ci/forge-ci-runtime-android-35@sha256:3a74feaa1cba71cb5684f21e3ea46d197806faf96137298b45854b79bbbaf3f1 # FIXME v0.90.0 digest
      build-module: app
      product-flavor: demo
      build-types: release
      include-aab: true
      enable-signing: true
      artifact-name-prefix: dev
      include-date-stamp: false
      enforce-application-tests: false
  # Publish to Google Play internal track
  publish-google-play:
    needs: build
    uses: hanklankorg/fc-forge-ci/.github/workflows/publish-google-play.yml@d33ea2bd2260bad172b2af3a79d2a2f066dfc293 # v0.90.0
    permissions:
      actions: read
      contents: read
    secrets:
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
    with:
      forge-ci-binary-ref: d33ea2bd2260bad172b2af3a79d2a2f066dfc293
      runtime-image: ghcr.io/hanklankorg/fc-forge-ci/forge-ci-runtime-base@sha256:9864c261c1b2f71d46eac2520f2e66de6b1ceb03c50f8d91acd19ddbccdd53e8 # FIXME v0.90.0 digest
      branch: ${{ github.ref }}
      aab-artifact-name: ${{ needs.build.outputs.aab-name }}
      package-name: "se.digg.wallet.demo"
      track: "internal"
      status: "completed"
