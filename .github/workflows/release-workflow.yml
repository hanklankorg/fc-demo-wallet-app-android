# Runs when you push a signed release-request/vX.Y.Z tag; the release bumps
# the version, writes the changelog and creates the final vX.Y.Z tag, never
# you. It builds the signed demo release AAB, attaches it to the GitHub
# release and publishes it to the Google Play internal track.
name: Release Workflow
on:
  push:
    tags:
      - "release-request/v*"
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  release:
    uses: hanklankorg/fc-forge-ci/.github/workflows/release-orchestrator.yml@d33ea2bd2260bad172b2af3a79d2a2f066dfc293 # v0.90.0
    permissions:
      contents: write
      packages: write
      id-token: write
      actions: read
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      # GPG signs the artifacts and the release commit and tag.
      RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
      RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
      RELEASE_GPG_PUBLIC_KEY: ${{ secrets.RELEASE_GPG_PUBLIC_KEY }}
      CODE_SCANNING_TOKEN: ${{ secrets.CODE_SCANNING_TOKEN }}
      # Android signing (enable-android-signing: true), the decoded
      # secrets.properties of the build and Google Play.
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      SECRETS_PROPERTIES_BASE64: ${{ secrets.SECRETS_PROPERTIES_BASE64 }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
    with:
      branch: main
      # Alpha, beta and release-candidate requests are released as before.
      release-policy: stable-prerelease
      # The full commit the workflow ref above names. Every plain-runner job
      # runs the CLI built in this run from exactly this commit.
      forge-ci-binary-ref: d33ea2bd2260bad172b2af3a79d2a2f066dfc293
      # Every runtime image is pinned by digest: the workflow that runs it
      # refuses anything else before its job starts. Replace FIXME with
      # the digests of the release you call; see
      # https://github.com/diggsweden/forge-ci/blob/main/docs/runtime-images.md#advanced-pinning-recipe
      runtime-image: ghcr.io/hanklankorg/fc-forge-ci/forge-ci-runtime-base@sha256:9864c261c1b2f71d46eac2520f2e66de6b1ceb03c50f8d91acd19ddbccdd53e8 # FIXME v0.90.0 digest
      canonical-builder-image: ghcr.io/hanklankorg/fc-forge-ci/forge-ci-runtime-go-1.27@sha256:d617197ad72db4c7a40e8d9727bcef523218b13b1f59c85b046aa5d9bb60d2e5 # FIXME v0.90.0 digest
      runtime-image-full: ghcr.io/hanklankorg/fc-forge-ci/forge-ci-runtime@sha256:3dd6b0fc992f5914f529a8849f5a10a9fd81e2cdd6fc82d7ee6c2dc941c9b6f4 # FIXME v0.90.0 digest
      runtime-image-android: ghcr.io/hanklankorg/fc-forge-ci/forge-ci-runtime-android-35@sha256:3a74feaa1cba71cb5684f21e3ea46d197806faf96137298b45854b79bbbaf3f1 # FIXME v0.90.0 digest
      artifacts-config: .forge-ci/artifacts.yml
      release-publisher: github-cli
      enforce-vulnerabilities: false
      enforce-application-tests: false
      enforce-reproducible-builds: false
