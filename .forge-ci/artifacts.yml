# Artifacts Configuration for wallet-app-android
# Android application - the AAB is attached to the GitHub Release
# and published to Google Play internal track

# The release files, the release commit and the final tag are signed with
# the GPG key in RELEASE_GPG_PRIVATE_KEY, as before.
sign:
  method: gpg

git-signing:
  method: gpg

artifacts:
  - name: wallet-android-demo
    project-type: gradle-android
    working-directory: .
    build-type: application
    publish-to:
      - google-play
    config:
      java-version: 21
      build-module: app
      # Declarative variant selection: the orchestrator derives gradle tasks
      # from product-flavor + build-types + include-aab. The build's AAB
      # upload name uses the `name:` above, so it lines up with what the
      # release publish stage forwards to publish-google-play.
      product-flavor: demo
      build-types: release
      gradle-version-file: gradle.properties
      # Signing configuration (requires secrets)
      enable-android-signing: true
      # Google Play configuration
      package-name: se.digg.wallet.demo
      google-play-track: internal
      google-play-status: completed
